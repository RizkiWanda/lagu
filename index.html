<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Idul Fitri</title>

<style>

body{
margin:0;
background:linear-gradient(#021B2B,#043B5C);
font-family:Arial;
color:white;
overflow:hidden;
text-align:center;
}

/* BULAN */

.moon{
position:absolute;
top:40px;
right:40px;
width:80px;
height:80px;
background:gold;
border-radius:50%;
box-shadow:0 0 30px gold;
}

.moon::after{
content:"";
position:absolute;
top:-8px;
left:25px;
width:80px;
height:80px;
background:#021B2B;
border-radius:50%;
}

/* BINTANG */

.star{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:shoot 5s linear infinite;
}

@keyframes shoot{
0%{transform:translate(0,0);opacity:1;}
100%{transform:translate(-600px,400px);opacity:0;}
}

/* KETUPAT */

.ketupat{
position:absolute;
width:40px;
height:40px;
background:green;
transform:rotate(45deg);
top:20%;
left:10%;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0) rotate(45deg);}
50%{transform:translateY(-20px) rotate(45deg);}
}

/* AMplop THR */

.thr-drop{
position:absolute;
top:-50px;
font-size:30px;
animation:fall 5s linear infinite;
}

@keyframes fall{
0%{top:-50px;}
100%{top:100vh;}
}

/* CONTAINER */

.container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
perspective:1200px;
}

/* BOOK */

.book{
width:90%;
max-width:360px;
height:520px;
position:relative;
transform-style:preserve-3d;
}

/* PAGE */

.page{
position:absolute;
width:100%;
height:100%;
background:rgba(255,255,255,0.1);
border-radius:20px;
padding:30px;
backdrop-filter:blur(10px);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
backface-visibility:hidden;
transition:1s;
}

/* FLIP EFFECT */

.flip{
transform:rotateY(180deg);
}

/* FOTO */

.foto{
width:140px;
height:140px;
border-radius:20px;
margin-bottom:15px;
background-image:url("https://raw.githubusercontent.com/RizkiWanda/lagu/main/foto.png");
background-size:cover;
background-position:center;
box-shadow:0 0 15px rgba(255,255,255,0.6);
}

/* TEXT */

.page h1{font-size:32px;}
.page h2{font-size:26px;}
.page p{font-size:18px;}

.hidden{display:none;}

button{
margin-top:20px;
padding:14px 26px;
border:none;
border-radius:12px;
background:gold;
font-weight:bold;
cursor:pointer;
}

/* KEMBANG API */

.firework{
position:absolute;
width:5px;
height:5px;
background:yellow;
border-radius:50%;
animation:explode 1s ease-out infinite;
}

@keyframes explode{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(10);opacity:0;}
}

</style>
</head>

<body>

<!-- AUDIO -->
<audio id="lagu" loop>
<source src="takbiran.mp3" type="audio/mpeg">
</audio>

<div class="moon"></div>

<div class="star" style="top:80px; left:80%"></div>

<div class="ketupat"></div>

<div class="thr-drop" style="left:20%">💸</div>
<div class="thr-drop" style="left:60%;animation-delay:2s">💸</div>

<div class="firework" style="top:30%;left:50%"></div>

<div class="container">

<div class="book">

<!-- PAGE 1 -->
<div class="page" id="page1">

<div class="foto"></div>

<h1>🌙 Selamat Hari Raya</h1>
<h2>Idul Fitri 1447 H</h2>

<p id="penerima">Untuk Anda</p>

<button onclick="next1()">Buka Kartu</button>

</div>

<!-- PAGE 2 -->
<div class="page hidden" id="page2">

<h2>Ucapan</h2>

<p>Taqabbalallahu minna wa minkum  
Mohon maaf lahir dan batin.</p>

<button onclick="next2()">Lanjut</button>

</div>

<!-- PAGE 3 -->
<div class="page hidden" id="page3">

<h2>Doa</h2>

<p>Semoga Allah menerima amal ibadah kita</p>

<p>🌙 Eid Mubarak 🌙</p>

<p>
😆 Kirim THR ya  
<br><br>
💳 7273078244  
<br>
📱 082273398353
</p>

<button onclick="location.reload()">Tutup</button>

</div>

</div>
</div>

<script>

function playMusic(){
let lagu = document.getElementById("lagu");
lagu.volume = 0;
lagu.play();

let v=0;
let fade=setInterval(()=>{
if(v<1){
v+=0.1;
lagu.volume=v;
}else{
clearInterval(fade);
}
},200);
}

function next1(){
playMusic();

document.getElementById("page1").classList.add("hidden");
document.getElementById("page2").classList.remove("hidden");
}

function next2(){
document.getElementById("page2").classList.add("hidden");
document.getElementById("page3").classList.remove("hidden");
}

/* NAMA */

const params=new URLSearchParams(window.location.search);
let nama=params.get("nama");

if(nama){
document.getElementById("penerima").innerText="Untuk "+nama;
}

</script>

</body>
</html>
