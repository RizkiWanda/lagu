<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Idul Fitri Cinematic</title>

<style>

body{
margin:0;
background:#021B2B;
font-family:Arial;
color:white;
overflow:hidden;
}

/* CANVAS */

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* BINTANG HIDUP */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
0%,100%{opacity:0.2;}
50%{opacity:1;}
}

/* MASJID */

.masjid{
position:absolute;
bottom:0;
width:100%;
height:180px;
background:black;
clip-path:polygon(
0% 100%,10% 60%,20% 100%,30% 50%,40% 100%,
50% 40%,60% 100%,70% 60%,80% 100%,90% 70%,100% 100%
);
opacity:0.6;
}

/* CONTAINER */

.container{
position:relative;
z-index:2;
width:100%;
height:100vh;
overflow:hidden;
}

/* SLIDER */

.slider{
display:flex;
width:300%;
height:100%;
transition:0.5s;
}

/* PAGE */

.page{
width:100%;
flex-shrink:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

/* CINEMATIC */

.page{
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

/* FOTO */

.foto{
width:140px;
height:140px;
border-radius:20px;
background-image:url("https://raw.githubusercontent.com/RizkiWanda/lagu/main/foto.png");
background-size:cover;
background-position:center;
box-shadow:0 0 20px white;
margin-bottom:20px;
}

/* TEXT */

h1{font-size:28px;}
h2{font-size:22px;}
p{font-size:16px;text-align:center;}

/* BUTTON */

button{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
background:gold;
font-weight:bold;
}

/* FIREWORK */

.firework{
position:absolute;
width:4px;
height:4px;
border-radius:50%;
animation:boom 1s infinite;
}

@keyframes boom{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(8);opacity:0;}
}

</style>
</head>

<body>

<canvas id="fire"></canvas>

<div class="masjid"></div>

<audio id="lagu" loop>
<source src="takbiran.mp3">
</audio>

<div class="container" id="container">

<div class="slider" id="slider">

<!-- PAGE 1 -->
<div class="page">

<div class="foto"></div>

<h1>🌙 Selamat Hari Raya</h1>
<h2>Idul Fitri 1447 H</h2>

<p id="nama">Untuk Anda</p>

<button onclick="start()">Mulai</button>

</div>

<!-- PAGE 2 -->
<div class="page">

<h2>Ucapan</h2>

<p>
Taqabbalallahu minna wa minkum  
Mohon maaf lahir dan batin
</p>

</div>

<!-- PAGE 3 -->
<div class="page">

<h2>Doa</h2>

<p>Semoga Allah menerima amal ibadah kita</p>

<p>🌙 Eid Mubarak 🌙</p>

<p>
💸 THR 😆  
<br><br>
💳 7273078244  
<br>
📱 082273398353
</p>

<button onclick="location.reload()">Tutup</button>

</div>

</div>
</div>

<script>

/* BINTANG */

for(let i=0;i<80;i++){
let s=document.createElement("div");
s.className="star";
s.style.top=Math.random()*100+"%";
s.style.left=Math.random()*100+"%";
s.style.animationDelay=Math.random()*2+"s";
document.body.appendChild(s);
}

/* FIREWORK CANVAS */

let canvas=document.getElementById("fire");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function fire(){
let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;

for(let i=0;i<40;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,
life:100,
color:`hsl(${Math.random()*360},100%,50%)`
});
}
}

function animate(){
ctx.fillStyle="rgba(0,0,0,0.2)";
ctx.fillRect(0,0,canvas.width,canvas.height);

particles.forEach((p,i)=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,3,3);

if(p.life<=0)particles.splice(i,1);
});

requestAnimationFrame(animate);
}

setInterval(fire,800);
animate();

/* AUDIO */

function start(){
let lagu=document.getElementById("lagu");
lagu.play();
}

/* SWIPE */

let slider=document.getElementById("slider");
let startX=0;
let index=0;

document.getElementById("container").addEventListener("touchstart",(e)=>{
startX=e.touches[0].clientX;
});

document.getElementById("container").addEventListener("touchend",(e)=>{
let endX=e.changedTouches[0].clientX;

if(startX-endX>50 && index<2){
index++;
}else if(endX-startX>50 && index>0){
index--;
}

slider.style.transform="translateX(-"+index*100+"%)";
});

/* NAMA */

let params=new URLSearchParams(window.location.search);
let nama=params.get("nama");

if(nama){
document.getElementById("nama").innerText="Untuk "+nama;
}

</script>

</body>
</html>
