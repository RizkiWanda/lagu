<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Idul Fitri</title>

<style>

body{
margin:0;
background:linear-gradient(#021B2B,#043B5C);
font-family:Arial;
color:white;
overflow:hidden;
}

/* CANVAS FIREWORK */

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* MASJID SILUET */

.masjid{
position:absolute;
bottom:0;
width:100%;
height:200px;
background:linear-gradient(to top,#000000cc,transparent);
clip-path:polygon(
0% 100%,10% 70%,20% 100%,30% 60%,40% 100%,
50% 50%,60% 100%,70% 60%,80% 100%,90% 70%,100% 100%
);
}

/* BINTANG JATUH */

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:shoot 5s linear infinite;
}

@keyframes shoot{
0%{transform:translate(0,0);opacity:1;}
100%{transform:translate(-600px,400px);opacity:0;}
}

/* KETUPAT */

.ketupat{
position:absolute;
width:30px;
height:30px;
background:green;
transform:rotate(45deg);
top:20%;
left:10%;
animation:float 4s infinite;
}

@keyframes float{
0%,100%{transform:translateY(0) rotate(45deg);}
50%{transform:translateY(-15px) rotate(45deg);}
}

/* CONTAINER */

.container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
perspective:2000px;
position:relative;
z-index:2;
}

/* BOOK */

.book{
width:320px;
height:480px;
position:relative;
transform-style:preserve-3d;
}

/* PAGE */

.page{
position:absolute;
width:100%;
height:100%;
background:rgba(255,255,255,0.1);
border-radius:20px;
padding:25px;
backdrop-filter:blur(12px);
transform-origin:left;
transition:1s;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
backface-visibility:hidden;

/* HIASAN BOX */
border:2px solid rgba(255,255,255,0.2);
box-shadow:0 0 20px rgba(255,215,0,0.5);
}

/* HALAMAN BELAKANG */

.page2,.page3{
transform:rotateY(180deg);
}

/* FOTO */

.foto{
width:120px;
height:120px;
border-radius:20px;
background-image:url("https://raw.githubusercontent.com/RizkiWanda/lagu/main/foto.png");
background-size:cover;
background-position:center;
margin-bottom:15px;
box-shadow:0 0 15px white;
}

/* LOGO MASJID */

.icon-masjid{
font-size:40px;
margin-bottom:10px;
}

/* TEXT */

h1{font-size:26px;margin:5px;}
h2{font-size:20px;}
p{font-size:15px;text-align:center;}

/* BUTTON */

button{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
background:gold;
cursor:pointer;
font-weight:bold;
}

</style>
</head>

<body>

<canvas id="fire"></canvas>

<div class="masjid"></div>

<div class="ketupat"></div>

<div class="star" style="top:80px;left:80%"></div>
<div class="star" style="top:150px;left:60%;animation-delay:1s"></div>

<audio id="lagu" loop>
<source src="takbiran.mp3">
</audio>

<div class="container">

<div class="book">

<!-- HALAMAN 1 -->
<div class="page" id="p1">

<div class="icon-masjid">🕌</div>

<div class="foto"></div>

<h1>🌙 Selamat Hari Raya</h1>
<h2>Idul Fitri 1447 H</h2>

<p id="nama">Untuk Anda</p>

<button onclick="openBook()">Buka</button>

</div>

<!-- HALAMAN 2 -->
<div class="page page2" id="p2">

<div class="icon-masjid">🕌</div>

<h2>Ucapan</h2>

<p>
Taqabbalallahu minna wa minkum  
Mohon maaf lahir dan batin
</p>

<button onclick="nextPage()">Lanjut</button>

</div>

<!-- HALAMAN 3 -->
<div class="page page3" id="p3">

<div class="icon-masjid">🕌</div>

<h2>Doa</h2>

<p>Semoga Allah menerima amal ibadah kita</p>

<p>🌙 Eid Mubarak 🌙</p>

<p>
💸 THR 😆  
<br><br>
💳 7273078244  
<br>
📱 082273398353
</p>

<button onclick="location.reload()">Tutup</button>

</div>

</div>
</div>

<script>

/* AUDIO */

function playMusic(){
let lagu=document.getElementById("lagu");
lagu.volume=0;
lagu.play();

let v=0;
let fade=setInterval(()=>{
if(v<1){
v+=0.1;
lagu.volume=v;
}else{
clearInterval(fade);
}
},200);
}

/* BOOK */

function openBook(){
playMusic();
document.getElementById("p1").style.transform="rotateY(-180deg)";
}

function nextPage(){
document.getElementById("p2").style.transform="rotateY(0deg)";
}

/* NAMA */

let params=new URLSearchParams(window.location.search);
let nama=params.get("nama");

if(nama){
document.getElementById("nama").innerText="Untuk "+nama;
}

/* FIREWORK */

let canvas=document.getElementById("fire");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function fire(){
let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;

for(let i=0;i<40;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,
life:100,
color:`hsl(${Math.random()*360},100%,50%)`
});
}
}

function animate(){
ctx.fillStyle="rgba(0,0,0,0.2)";
ctx.fillRect(0,0,canvas.width,canvas.height);

particles.forEach((p,i)=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,3,3);

if(p.life<=0)particles.splice(i,1);
});

requestAnimationFrame(animate);
}

setInterval(fire,800);
animate();

</script>

</body>
</html>
